name: Main Releasability Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional merged pull-request SHA that this run must validate."
        required: false
        type: string
      triggering_pr:
        description: "Optional pull request number that dispatched this mainline validation."
        required: false
        type: string
      source_branch:
        description: "Source branch name to stamp into release metadata when dispatch uses an immutable tag."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"
  COVERAGE_FAIL_UNDER: "98"

jobs:
  exact-revision-assertion:
    name: Main Releasability / Exact Revision Assertion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert expected merged PR SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No expected_sha input supplied; treating this as an operator-dispatched main releasability run."
            exit 0
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Main releasability checkout SHA $actual_sha does not match expected merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."
            exit 1
          fi
          echo "Validated exact merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."

  workflow-lint:
    name: Main Releasability / Workflow Lint
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-security:
    name: Main Releasability / Lint Typecheck Security
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Verify Dependencies
        run: python -m pip check
      - name: GitHub Actions Runtime Gate
        run: make github-actions-runtime-gate
      - name: Lint
        run: make lint
      - name: Monetary Float Guard
        run: make monetary-float-guard
      - name: No-Alias Contract Guard
        run: make no-alias-gate
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: OpenAPI Artifact Gate
        run: make openapi-artifact-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Architecture Gate
        run: make architecture-gate
      - name: Complexity Gate
        run: make complexity-gate
      - name: Source Size Gate
        run: make source-size-gate
      - name: Dependency Hygiene Gate
        run: make dependency-hygiene-gate
      - name: Dead Code Gate
        run: make dead-code-gate
      - name: Checkout Lotus Platform Contracts
        uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          path: .lotus-platform
      - name: Mesh Contract Validation
        run: make mesh-contract-validate
      - name: Image Supply Chain Gate
        run: make image-supply-chain-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Security Audit
        run: make security-audit

  test-suites:
    name: Main Releasability / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
          - suite: integration
            path: tests/integration
          - suite: e2e
            path: tests/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Run tests with coverage data
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: python -m pytest ${{ matrix.path }} --cov=src --cov-report=
      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error

  test-pyramid-gate:
    name: Main Releasability / Test Pyramid Gate
    needs: [test-suites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Enforce test pyramid distribution
        run: make test-pyramid-gate

  coverage-gate:
    name: Main Releasability / Coverage Gate (Combined)
    needs: [test-suites, test-pyramid-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Download coverage artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
      - name: Enforce coverage floor
        run: |
          python -m coverage combine coverage-data
          python -m coverage report --fail-under=${{ env.COVERAGE_FAIL_UNDER }}
      - name: Upload coverage summary
        uses: actions/upload-artifact@v6
        with:
          name: main-releasability-coverage-data
          path: |
            .coverage
            coverage-data
          include-hidden-files: true
          if-no-files-found: error

  docker-build:
    name: Main Releasability / Validate Docker Build
    needs: [coverage-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: make docker-build
