services:
  lotus-risk:
    build:
      context: .
      args:
        LOTUS_GIT_COMMIT_SHA: ${LOTUS_GIT_COMMIT_SHA:-unknown}
        LOTUS_GIT_BRANCH: ${LOTUS_GIT_BRANCH:-unknown}
        LOTUS_SERVICE_VERSION: ${LOTUS_SERVICE_VERSION:-0.1.0}
        LOTUS_BUILD_TIMESTAMP: ${LOTUS_BUILD_TIMESTAMP:-unknown}
        LOTUS_REPO_URL: ${LOTUS_REPO_URL:-unknown}
        LOTUS_IMAGE_DIGEST: ${LOTUS_IMAGE_DIGEST:-unavailable-before-publish}
        LOTUS_CI_PIPELINE_RUN_ID: ${LOTUS_CI_PIPELINE_RUN_ID:-local}
    ports:
      - "8130:8130"
    env_file:
      - path: .env
        required: false
    environment:
      LOTUS_CORE_BASE_URL: ${LOTUS_CORE_BASE_URL:-http://core-control.dev.lotus:8202}
      LOTUS_PERFORMANCE_BASE_URL: ${LOTUS_PERFORMANCE_BASE_URL:-http://performance.dev.lotus:8002}
    extra_hosts:
      - "core-control.dev.lotus:host-gateway"
      - "performance.dev.lotus:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8130/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 10
