services:
  lotus-risk:
    build: .
    ports:
      - "8130:8130"
    env_file:
      - .env
    environment:
      LOTUS_CORE_BASE_URL: ${LOTUS_CORE_BASE_URL:-http://core-query.dev.lotus:8202}
      LOTUS_PERFORMANCE_BASE_URL: ${LOTUS_PERFORMANCE_BASE_URL:-http://performance.dev.lotus:8002}
    extra_hosts:
      - "core-query.dev.lotus:host-gateway"
      - "performance.dev.lotus:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8130/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 10
