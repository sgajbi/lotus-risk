[mypy]
python_version = 3.12
strict = True
mypy_path = src
files = src, tests

# The branch-protection policy gate is lifted BYTE-IDENTICALLY from the
# canonical implementation (lotus-gateway at main) so that a canonical fix
# propagates to every adopter instead of silently forking an estate-wide
# control; its scheduled parity check compares content hashes. Editing it
# to satisfy this repository's stricter settings would defeat that, so the
# lift carries the canonical repository's typing posture instead.
[mypy-scripts.check_branch_protection_policy]
disallow_any_expr = False
warn_return_any = False

[mypy-tests.unit.test_branch_protection_policy]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_any_generics = False
strict_optional = False
