[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotus-risk"
version = "0.1.0"
description = "Advanced risk analytics service for Lotus platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.133.0",
  "starlette>=1.0.1",
  "uvicorn>=0.41.0",
  "pydantic>=2.12.0",
  "prometheus-client>=0.25.0",
  "httpx>=0.28.0",
  "numpy>=2.3.0",
  "pandas>=2.3.0"
]

[project.optional-dependencies]
dev = [
  "ruff==0.15.21",
  "mypy==2.3.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "coverage>=7.13.0",
  "pandas-stubs>=2.3.2.250926",
  "pip-audit>=2.10.0",
  "bandit==1.9.4",
  "deptry==0.25.1",
  "import-linter==2.13",
  "radon==6.0.1",
  "vulture==2.16",
  "pre-commit>=4.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.deptry]
known_first_party = ["app", "_repo_imports", "scripts"]
optional_dependencies_dev_groups = ["dev"]
per_rule_ignores = { DEP002 = ["uvicorn"], DEP004 = ["coverage"] }
